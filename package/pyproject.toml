[project]
name = "robin"
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "torchaudio", "safetensors", "tokenizers", "huggingface_hub", "numpy", "soundfile", "s3tokenizer>=0.3.0"]

[project.optional-dependencies]
gui = ["gradio>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["robin"]
